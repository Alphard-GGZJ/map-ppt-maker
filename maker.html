<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>地图可视化PPT生成器</title>
    <link rel="icon" type="image/png" href="./favicon.png">
    <script src="./pptxgen.bundle.js"></script>
    <script src="./xlsx.full.min.js"></script>
    <style>
        body { font-family: 'Microsoft YaHei', 'Segoe UI', Tahoma, sans-serif; display: flex; height: 100vh; margin: 0; background: #2c3e50; color: #fff; overflow: hidden;}
        #sidebar { width: 400px; background: #34495e; padding: 20px; box-shadow: 2px 0 10px rgba(0,0,0,0.3); overflow-y: auto; display: flex; flex-direction: column; gap: 15px;}
        .panel-section { background: #2c3e50; padding: 15px; border-radius: 8px; border: 1px solid #1a252f;}
        .panel-section h4 { margin: 0 0 10px 0; font-size: 14px; color: #3498db; border-bottom: 1px solid #1a252f; padding-bottom: 5px;}
        .btn { display: block; width: 100%; padding: 8px; cursor: pointer; background: #3498db; color: white; border: none; border-radius: 4px; font-size: 14px; transition: 0.2s; margin-bottom: 5px;}
        .btn:hover { background: #2980b9; }
        .btn-green { background: #2ecc71; }
        .btn-red { background: #e74c3c; }
        .btn-gray { background: #7f8c8d; }
        input[type="file"] { display: none; }
        .file-label { display: block; text-align: center; padding: 8px; background: #7f8c8d; border-radius: 4px; cursor: pointer; font-size: 13px; margin-bottom: 5px;}
        .col-config { display: flex; align-items: center; gap: 5px; margin-bottom: 5px; font-size: 12px;}
        .col-config textarea { flex: 1; padding: 4px; border-radius: 4px; border: none; resize: vertical; font-family: inherit; }
        .col-config input[type="number"] { width: 60px; padding: 4px; border-radius: 4px; border: none; }
        #main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #1a252f; overflow: auto; padding: 20px;}
        .slide-canvas { width: 960px; height: 540px; background: #fff; position: relative; box-shadow: 0 10px 30px rgba(0,0,0,0.5); overflow: hidden; color: #333;}
        .draggable { position: absolute; cursor: grab; user-select: none; box-sizing: border-box; }
        .draggable:active { cursor: grabbing; }
        .draggable.selected { outline: 2px dashed #3498db; }
        #map-container.selected { outline: 2px dashed #3498db; outline-offset: 2px; min-height: 20px; }
        .resize-handle { position: absolute; right: -5px; bottom: -5px; width: 10px; height: 10px; background: #3498db; cursor: se-resize; display: none; border-radius: 50%; }
        .draggable.selected .resize-handle { display: block; }
        #map-container { left: 50px; top: 100px; width: 450px; min-height: 50px; } #map-container.selected { box-shadow: 0 0 0 2px #3498db; }
        #mapImg { width: 100%; height: auto; display: block; pointer-events: none; }
        #table-container { left: 680px; top: 50px; width: 250px; height: auto; background: #fff; }
        .data-table { width: 100%; height: 100%; border-collapse: collapse; table-layout: fixed; border: 2px solid #4C8714; font-family: 'Microsoft YaHei', sans-serif; }
        .data-table th { background-color: #4C8714; color: #fff; border: 2px solid #8BB06B; text-align: center; font-weight: bold; white-space: pre-wrap; line-height: 1.1; }
        .data-table td { border: 2px solid #8BB06B; color: #000; text-align: center; font-weight: bold; white-space: nowrap; }
        .data-table tbody tr:nth-child(odd) td { background-color: #E2F0D9; }
        .data-table tbody tr:nth-child(even) td { background-color: #ffffff; }
        #status { font-size: 12px; color: #bdc3c7; margin-top: 10px; white-space: pre-wrap;}
    </style>
</head>
<body>

    <div id="sidebar">
        <div class="panel-section">
            <div style="text-align: center; margin-bottom: 10px;">
                <img src="./alpicon.png" style="width: 80px; height: 80px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.3);">
                <h3 style="margin: 5px 0 0 0; color: #3498db; font-size: 18px; letter-spacing: 1px;">由Alphard_改革则吉ver制作</h3>
            </div>
            <h4>1. 导入数据</h4>
            <label class="file-label" for="folderInput">📂 选择地图图片 (可多选)</label>
            <input type="file" id="folderInput" accept="image/jpeg, image/png" multiple>
            <p style="font-size: 11px; color: #e74c3c; margin: 5px 0 10px 0; line-height: 1.4;">⚠️ 建议将地图图片命名为纯数字（如：1.png），系统会自动按数字从小到大排列。</p>

            <label class="file-label" for="dataInput">📊 选择数据表格 (Excel)</label>
            <input type="file" id="dataInput" accept=".xlsx,.xls,.csv">
            <p style="font-size: 11px; color: #3498db; margin: 5px 0 0 0; line-height: 1.4;">💡 支持 .xlsx / .xls / .csv。系统默认将第一行识别为表头。</p>
            <button class="btn btn-gray" onclick="downloadSampleExcel()" style="margin-top: 8px; font-size: 12px;">📥 下载数据表格样例 (Excel)</button>
        </div>
        
        <div class="panel-section" id="colConfigSection" style="display: none;">
            <h4>2. 列宽与表头设置</h4>
            <div style="background: #1a252f; border-left: 4px solid #f1c40f; padding: 10px; border-radius: 4px; margin-bottom: 10px; font-size: 12px; line-height: 1.6; color: #bdc3c7;">
                <strong style="color: #fff;">💡 高级表头语法说明：</strong><br>
                1. <b>换行：</b>直接按回车键。<br>
                2. <b>混搭字号：</b>输入 <code style="background:#2c3e50; padding:0 3px; border-radius:3px; color:#e74c3c;">[20]区县</code>。<br>
                3. <b>同行混搭：</b>输入 <code style="background:#2c3e50; padding:0 3px; border-radius:3px; color:#e74c3c;">[20]区县[12](含排名)</code>。
            </div>
            <div id="colConfigList" style="margin-bottom: 10px;"></div>
        </div>

        <div class="panel-section">
            <h4>3. 表格尺寸精细控制</h4>
            <div style="margin-top: 10px; display: flex; align-items: center; gap: 10px;">
                <input type="checkbox" id="provincialCapToggle" onchange="renderSlide(currentPreviewIndex)" style="cursor: pointer;">
                <label style="font-size: 12px; color: #e74c3c; cursor: pointer;" for="provincialCapToggle">省会文字强制标红</label>
                <input type="text" id="provincialCapName" placeholder="如：成都" value="成都" oninput="renderSlide(currentPreviewIndex)" style="width: 100px; padding: 4px; border-radius: 4px; border: none; font-size: 12px;">
            </div>
            <div style="display: flex; gap: 10px; margin-top: 10px;">
                <div style="flex: 1;"><label style="font-size: 12px;">总宽度：</label><input type="range" id="tableWidthRange" min="100" max="800" value="250" style="width: 100%;"></div>
                <div style="flex: 1;"><label style="font-size: 12px;">总高度：</label><input type="range" id="tableHeightRange" min="100" max="540" value="440" style="width: 100%;"></div>
            </div>
            <div style="margin-top: 10px; display: flex; align-items: center; gap: 10px;">
                <label style="font-size: 12px; white-space: nowrap;">前几页留空：</label><input type="number" id="emptyPagesInput" value="0" min="0" style="width: 60px; padding: 4px; border-radius: 4px; border: none;">
            </div>
            <div style="margin-top: 10px; display: flex; align-items: center; gap: 10px;">
                <label style="font-size: 12px; white-space: nowrap; color: #e74c3c;">最后几页变红：</label><input type="number" id="redPagesInput" value="0" min="0" style="width: 60px; padding: 4px; border-radius: 4px; border: none;">
            </div>
        </div>

        <div class="panel-section">
            <h4>4. 添加独立元素 (图层)</h4>
            <button class="btn btn-green" onclick="addTextElement()">+ 添加多色文字</button>
            <label class="file-label" for="imageUploader">+ 添加图片/Logo</label>
            <input type="file" id="imageUploader" accept="image/jpeg, image/png">
            <button class="btn btn-gray" onclick="openCoverEditor()" style="margin-top: 5px; background: #e67e22;">✨ 制作封面 (独立页)</button>
        </div>

        <div class="panel-section">
            <h4>5. 画布及全局字体设置</h4>
            <label style="font-size: 13px;">背景颜色：</label><input type="color" id="bgColor" value="#f0f0f0" style="width: 100%; height: 30px; border: none; cursor: pointer; margin-bottom: 10px;">
            <div style="display: flex; gap: 10px;">
                <div style="flex: 1;"><label style="font-size: 12px;">表头字号：</label><input type="range" id="thFontSize" min="8" max="30" value="14" style="width: 100%;"></div>
                <div style="flex: 1;"><label style="font-size: 12px;">数据字号：</label><input type="range" id="tdFontSize" min="8" max="30" value="14" style="width: 100%;"></div>
            </div>
            <div style="display: flex; gap: 10px; margin-top: 15px;">
                <button class="btn btn-gray" onclick="prevSlide()">⬅️ 上一页</button>
                <button class="btn btn-gray" onclick="nextSlide()">下一页 ➡️</button>
            </div>
            <div style="text-align: center; margin-top: 10px; font-size: 14px;">第 <input type="number" id="pageInput" value="1" min="1" style="width: 50px; text-align: center; border-radius: 4px; border: 1px solid #ccc;"> / <span id="totalPages">0</span> 页</div>
        </div>
        
        <div class="panel-section" style="flex-grow: 1;">
            <h4>6. 导出</h4>
            <button class="btn btn-red" id="exportBtn">🚀 导出 PPT 文件</button>
            <div id="status" style="margin-top: 20px;">等待上传文件...</div>
        </div>
    </div>

    <div id="main">
        <div class="slide-canvas" id="canvas">
            <div id="map-container" class="draggable">
                <img src="" id="mapImg" style="display: none;">
                <div class="resize-handle"></div>
            </div>
            <div id="table-container" class="draggable">
                <table class="data-table" id="previewTable">
                    <thead id="dynamicThead"></thead>
                    <tbody></tbody>
                </table>
                <div class="resize-handle"></div>
            </div>
        </div>
    </div>

    <!-- 独立封面编辑器 -->
    <div id="coverModal" style="display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.85); z-index: 10000; justify-content: center; align-items: center; flex-direction: column;">
        <h3 style="color: white; margin-bottom: 10px;">📝 封面制作器</h3>
        
        <div style="display: flex; gap: 20px;">
            <!-- 画布 -->
            <div style="position: relative; width: 960px; height: 540px; background: #e2e2e2; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.5);" id="coverCanvas">
                
                <div id="coverImgContainer" style="position: absolute; left: 0px; top: 0px; width: 960px; height: 540px; cursor: move; border: 2px dashed transparent; box-sizing: border-box;">
                    <img id="coverImg" style="width: 100%; height: 100%; object-fit: contain; display: none; pointer-events: none;">
                    <div class="resize-handle" style="position: absolute; right: 0; bottom: 0; width: 20px; height: 20px; background: #3498db; border-radius: 50%; cursor: se-resize; display: block;"></div>
                </div>
                
                <div id="coverText1" class="cover-text-el" style="position: absolute; left: 120px; top: 220px; font-weight: 900; font-size: 72px; color: #FF1493; display: none; cursor: move; padding: 0px; border: 1px dashed transparent; white-space: nowrap;">湖南省各区县</div>
                
                <div id="coverText2" class="cover-text-el" style="position: absolute; left: 80px; top: 350px; font-weight: 900; font-size: 80px; color: #1E90FF; display: none; cursor: move; padding: 0px; border: 1px dashed transparent; white-space: nowrap;">2025年GDP地图</div>
            </div>

            <!-- 右侧控制面板 -->
            <div style="background: #2c3e50; padding: 20px; border-radius: 8px; width: 300px; border: 1px solid #3498db; display: flex; flex-direction: column; gap: 15px;">
                <div>
                    <label style="color: white; font-size: 14px; display: block; margin-bottom: 5px;">选中文字：</label>
                    <select id="coverTextSelector" onchange="switchCoverText()" style="width: 100%; padding: 8px; border-radius: 4px; border: none;">
                        <option value="text1">主标题</option>
                        <option value="text2">副标题</option>
                    </select>
                </div>
                <div>
                    <label style="color: white; font-size: 14px; display: block; margin-bottom: 5px;">内容修改：</label>
                    <input type="text" id="coverTextInput" style="width: 100%; padding: 8px; border-radius: 4px; border: none;" placeholder="在这里修改文字内容" oninput="updateCoverText()">
                </div>
                <div>
                    <label style="color: white; font-size: 14px; display: block; margin-bottom: 5px;">字号大小：</label>
                    <input type="range" id="coverFontSize" min="20" max="150" value="72" style="width: 100%;" oninput="updateCoverStyle()">
                </div>
                <div>
                    <label style="color: white; font-size: 14px; display: block; margin-bottom: 5px;">文字颜色：</label>
                    <input type="color" id="coverColor" value="#FF1493" style="width: 100%; height: 40px; border: none; cursor: pointer;" oninput="updateCoverStyle()">
                </div>
                <div>
                    <label style="color: white; font-size: 14px; display: block; margin-bottom: 5px;">封面背景颜色：</label>
                    <input type="color" id="coverBgColor" value="#e2e2e2" style="width: 100%; height: 40px; border: none; cursor: pointer;" oninput="document.getElementById('coverCanvas').style.backgroundColor = this.value">
                </div>
            </div>
        </div>

        <div style="margin-top: 20px; display: flex; gap: 20px;">
            <button class="btn btn-green" style="padding: 10px 30px; font-size: 16px;" onclick="confirmCover()">✅ 保存并关闭</button>
            <button class="btn btn-gray" style="padding: 10px 30px; font-size: 16px;" onclick="document.getElementById('coverModal').style.display='none'">❌ 取消</button>
        </div>
    </div>

    <script>
        let slidesData = []; 
        let currentPreviewIndex = 0; 
        let dynamicColumns = []; 
        let globalStyle = { bgColor: '#f0f0f0', thFontSize: 14, tdFontSize: 14 }; 
        let customElements = []; 
        let elementIdCounter = 0;
        let activeEl = null; 
        let savedCoverData = null; 
        try { const c = localStorage.getItem('alphardCover'); if (c) savedCoverData = JSON.parse(c); } catch(e) {}

        // === 画布内的拖动逻辑 ===
        let isDragging = false, isResizing = false;
        let startX, startY, startLeft, startTop, startW, startH;

        document.getElementById('canvas').addEventListener('mousedown', function(e) {
            const draggable = e.target.closest('.draggable');
            if (!draggable) {
                document.querySelectorAll('.draggable').forEach(el => el.classList.remove('selected'));
                activeEl = null;
                return;
            }
            document.querySelectorAll('.draggable').forEach(el => el.classList.remove('selected'));
            draggable.classList.add('selected');
            activeEl = draggable;

            if (e.target.classList.contains('resize-handle')) isResizing = true;
            else isDragging = true;

            startX = e.clientX; startY = e.clientY;
            startLeft = draggable.offsetLeft; startTop = draggable.offsetTop;
            
            if (draggable.id === 'map-container') {
                let imgDom = document.getElementById('mapImg');
                startW = draggable.offsetWidth;
                startH = startW * (imgDom.naturalHeight / imgDom.naturalWidth);
            } else {
                startW = draggable.offsetWidth; startH = draggable.offsetHeight;
            }
            e.preventDefault();
        });

        document.addEventListener('mousemove', function(e) {
            if (!activeEl) return;
            const dx = e.clientX - startX;
            const dy = e.clientY - startY;

            if (isDragging) {
                activeEl.style.left = (startLeft + dx) + 'px';
                activeEl.style.top = (startTop + dy) + 'px';
            } else if (isResizing) {
                if (activeEl.id === 'table-container') {
                    activeEl.style.width = (startW + dx) + 'px';
                    activeEl.style.height = (startH + dy) + 'px';
                } else {
                    let newW = startW + dx;
                    if (newW < 50) newW = 50;
                    let ratio = startH / startW;
                    activeEl.style.width = newW + 'px';
                    activeEl.style.height = (newW * ratio) + 'px';
                }
            }
        });

        document.addEventListener('mouseup', function() {
            if (!activeEl) return;
            if (activeEl.dataset.customId) {
                let id = parseInt(activeEl.dataset.customId);
                let elData = customElements.find(el => el.id === id);
                if (elData) {
                    elData.x = activeEl.offsetLeft; elData.y = activeEl.offsetTop;
                    elData.w = activeEl.offsetWidth; elData.h = activeEl.offsetHeight;
                }
            }
            if (activeEl.id === 'table-container') {
                document.getElementById('tableWidthRange').value = activeEl.offsetWidth;
                document.getElementById('tableHeightRange').value = activeEl.offsetHeight;
                renderSlide(currentPreviewIndex); 
            }
            isDragging = false;
            isResizing = false;
        });

        // === 封面编辑器的拖动与缩放逻辑 ===
        let coverDragTarget = null;
        let coverIsResizing = false;
        let coverStartX, coverStartY, coverStartLeft, coverStartTop, coverStartW, coverStartH;

        document.getElementById('coverCanvas').addEventListener('mousedown', function(e) {
            const target = e.target;
            // 判断点击的是图片容器、文字、还是缩放点
            if (target.id === 'coverImgContainer' || target.classList.contains('cover-text-el') || target.classList.contains('resize-handle')) {
                if (target.classList.contains('resize-handle')) {
                    coverDragTarget = target.parentElement;
                    coverIsResizing = true;
                } else {
                    coverDragTarget = target;
                    coverIsResizing = false;
                    // 给选中的元素加虚线框，同时取消其他的
                    document.querySelectorAll('.cover-text-el').forEach(el => el.style.border = '1px dashed transparent');
                    if(target.classList.contains('cover-text-el')) {
                        target.style.border = '1px dashed #3498db';
                        // 同步右侧面板
                        let selector = document.getElementById('coverTextSelector');
                        selector.value = target.id === 'coverText1' ? 'text1' : 'text2';
                        switchCoverText();
                    }
                }

                coverStartX = e.clientX;
                coverStartY = e.clientY;
                coverStartLeft = parseInt(coverDragTarget.style.left) || 0;
                coverStartTop = parseInt(coverDragTarget.style.top) || 0;
                coverStartW = coverDragTarget.offsetWidth;
                coverStartH = coverDragTarget.offsetHeight;

                document.addEventListener('mousemove', coverMove);
                document.addEventListener('mouseup', coverUp);
                e.preventDefault();
            }
        });

        function coverMove(e) {
            if (!coverDragTarget) return;
            const dx = e.clientX - coverStartX;
            const dy = e.clientY - coverStartY;

            if (coverIsResizing) {
                // 缩放地图
                let newW = coverStartW + dx;
                if (newW < 50) newW = 50;
                coverDragTarget.style.width = newW + 'px';
                coverDragTarget.style.height = 'auto'; // 保持比例
            } else {
                // 拖动
                coverDragTarget.style.left = (coverStartLeft + dx) + 'px';
                coverDragTarget.style.top = (coverStartTop + dy) + 'px';
            }
        }

        function coverUp() {
            coverDragTarget = null;
            document.removeEventListener('mousemove', coverMove);
            document.removeEventListener('mouseup', coverUp);
        }

        // === 打开封面编辑器 ===
        function openCoverEditor() {
            if (slidesData.length === 0) return alert("请先上传地图图片！");
            document.getElementById('coverModal').style.display = 'flex';
            
            // 1. 永远加载最后一张地图
            let lastImageUrl = slidesData[slidesData.length - 1].imageUrl;
            let img = document.getElementById('coverImg');
            img.src = lastImageUrl;
            img.style.display = 'block';
            
            // 2. 恢复尺寸、位置和背景
            let container = document.getElementById('coverImgContainer');
            let t1 = document.getElementById('coverText1');
            let t2 = document.getElementById('coverText2');
            t1.style.display = 'block';
            t2.style.display = 'block';

            if (savedCoverData) {
                container.style.left = savedCoverData.imgX + 'px';
                container.style.top = savedCoverData.imgY + 'px';
                container.style.width = savedCoverData.imgW + 'px';
                container.style.height = (savedCoverData.imgH || 540) + 'px';

                t1.innerText = savedCoverData.texts[0].content;
                t1.style.left = savedCoverData.texts[0].x + 'px'; t1.style.top = savedCoverData.texts[0].y + 'px';
                t1.style.fontSize = savedCoverData.texts[0].fontSize + 'px';
                t1.style.color = savedCoverData.texts[0].color;
                
                t2.innerText = savedCoverData.texts[1].content;
                t2.style.left = savedCoverData.texts[1].x + 'px'; t2.style.top = savedCoverData.texts[1].y + 'px';
                t2.style.fontSize = savedCoverData.texts[1].fontSize + 'px';
                t2.style.color = savedCoverData.texts[1].color;

                let savedBg = savedCoverData.bgColor ? '#' + rgbToHex(savedCoverData.bgColor) : '#e2e2e2';
                document.getElementById('coverCanvas').style.backgroundColor = savedBg;
                document.getElementById('coverBgColor').value = savedBg;
            } else {
                container.style.left = '0px'; container.style.top = '0px';
                container.style.width = '960px'; container.style.height = '540px';
                t1.innerText = "湖南省各区县"; t1.style.left = '120px'; t1.style.top = '220px';
                t2.innerText = "2025年GDP地图"; t2.style.left = '80px'; t2.style.top = '350px';
                document.getElementById('coverCanvas').style.backgroundColor = '#e2e2e2';
                document.getElementById('coverBgColor').value = '#e2e2e2';
            }

            document.getElementById('coverTextSelector').value = 'text1';
            switchCoverText();
        }

        // 切换文字并同步到输入框和颜色器
        function switchCoverText() {
            let selector = document.getElementById('coverTextSelector').value;
            let target = document.getElementById(selector === 'text1' ? 'coverText1' : 'coverText2');
            document.getElementById('coverTextInput').value = target.innerText;
            document.getElementById('coverColor').value = target.style.color;
            document.getElementById('coverFontSize').value = parseInt(target.style.fontSize);
        }

        // 更新文字内容
        function updateCoverText() {
            let selector = document.getElementById('coverTextSelector').value;
            let target = document.getElementById(selector === 'text1' ? 'coverText1' : 'coverText2');
            target.innerText = document.getElementById('coverTextInput').value;
        }

        // 更新文字颜色和字号
        function updateCoverStyle() {
            let selector = document.getElementById('coverTextSelector').value;
            let target = document.getElementById(selector === 'text1' ? 'coverText1' : 'coverText2');
            let color = document.getElementById('coverColor').value;
            let size = document.getElementById('coverFontSize').value;
            
            target.style.color = color;
            target.style.fontSize = size + 'px';
        }

        // === 保存封面 ===
        async function confirmCover() {
            let text1 = document.getElementById('coverText1');
            let text2 = document.getElementById('coverText2');
            let container = document.getElementById('coverImgContainer');

            savedCoverData = {
                bgColor: '#' + rgbToHex(document.getElementById('coverCanvas').style.backgroundColor || '#e2e2e2'),
                imgX: parseInt(container.style.left) || 0,
                imgY: parseInt(container.style.top) || 0,
                imgW: parseInt(container.style.width) || 960,
                imgH: parseInt(container.style.height) || 540,
                texts: [
                    { content: text1.innerText, x: parseInt(text1.style.left), y: parseInt(text1.style.top), fontSize: parseInt(text1.style.fontSize), color: text1.style.color },
                    { content: text2.innerText, x: parseInt(text2.style.left), y: parseInt(text2.style.top), fontSize: parseInt(text2.style.fontSize), color: text2.style.color }
                ]
            };
            
            localStorage.setItem('alphardCover', JSON.stringify(savedCoverData));
            document.getElementById('coverModal').style.display = 'none';
            alert("✅ 封面已保存！点击导出，它会自动出现在 PPT 第一页。");
        }

        // 读取上传的文件
        document.getElementById('folderInput').addEventListener('change', function(e) {
            const files = Array.from(e.target.files).filter(f => /\.(jpg|jpeg|png)$/i.test(f.name));
            files.sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true }));
            slidesData = files.map(file => ({ imageUrl: URL.createObjectURL(file), tableData: [] }));
            document.getElementById('status').innerText = `✅ 加载 ${slidesData.length} 张地图`;
            currentPreviewIndex = 0;
            renderSlide(currentPreviewIndex);
        });

        document.getElementById('dataInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                const data = new Uint8Array(e.target.result);
                const workbook = XLSX.read(data, {type: 'array'});
                const parsedData = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]], { header: 1 });
                
                let headers = (parsedData[0] || []).filter(h => h !== undefined && h !== null && h !== '');
                dynamicColumns = headers.map(h => ({ name: String(h), width: parseFloat((100 / headers.length).toFixed(1)) }));
                renderColConfig();

                let cleanData = [];
                for(let i = 1; i < parsedData.length; i++) {
                    let row = parsedData[i];
                    if(row && row.length > 0) {
                        let rowData = [];
                        for(let j = 0; j < headers.length; j++) rowData.push(row[j] !== undefined ? String(row[j]) : '');
                        cleanData.push({ rowCells: rowData });
                    }
                }
                window.currentCleanData = cleanData; 
                if (slidesData.length > 0) generateSlideData(cleanData);
                else alert("请先上传地图图片！");
            };
            reader.readAsArrayBuffer(file);
        });

        function renderColConfig() {
            const section = document.getElementById('colConfigSection');
            const list = document.getElementById('colConfigList');
            section.style.display = 'block';
            list.innerHTML = '';
            dynamicColumns.forEach((col, idx) => {
                let div = document.createElement('div');
                div.className = 'col-config';
                div.innerHTML = `
                    <textarea oninput="updateColName(${idx}, this.value)" rows="2" style="font-size: 12px;" placeholder="输入表头内容 (支持回车换行，支持 [20]文字 语法)">${col.name}</textarea>
                    <input type="number" value="${col.width}" oninput="updateColWidth(${idx}, this.value)"> %
                `;
                list.appendChild(div);
            });
        }
        window.updateColName = function(idx, val) { dynamicColumns[idx].name = val; renderSlide(currentPreviewIndex); };
        window.updateColWidth = function(idx, val) { dynamicColumns[idx].width = parseFloat(val) || 0; renderSlide(currentPreviewIndex); };

        function generateSlideData(cleanData) {
            const totalPages = slidesData.length;
            const totalData = cleanData.length;
            const emptyPages = parseInt(document.getElementById('emptyPagesInput').value) || 0;
            let maxRows = 10, filledRows = 0, isNewRound = true, bottomRank = totalData;

            for (let slideIdx = 0; slideIdx < totalPages; slideIdx++) {
                if (slideIdx < emptyPages) { slidesData[slideIdx].tableData = []; continue; }
                if (bottomRank < 1) { slidesData[slideIdx].tableData = []; continue; }
                let currentSlideData = [];
                if (isNewRound) { filledRows = 1; isNewRound = false; } 
                else if (filledRows < maxRows) filledRows++;
                if (bottomRank - filledRows + 1 < 1) filledRows = bottomRank;
                for (let i = 1; i <= filledRows; i++) {
                    let srcRowIdx = bottomRank - i; 
                    if (srcRowIdx >= 0) currentSlideData.unshift(cleanData[srcRowIdx]); 
                }
                slidesData[slideIdx].tableData = currentSlideData;
                if (filledRows === maxRows) {
                    let topRank = bottomRank - maxRows + 1;
                    if (topRank % 10 === 1 || topRank === 1) { bottomRank = topRank - 1; isNewRound = true; } 
                    else bottomRank--;
                }
            }
            renderSlide(currentPreviewIndex);
        }

        function renderSlide(index) {
            const slide = slidesData[index];
            if (!slide) return;

            document.getElementById('canvas').style.backgroundColor = globalStyle.bgColor;
            document.getElementById('mapImg').src = slide.imageUrl;
            document.getElementById('mapImg').style.display = 'block';

            const thead = document.getElementById('dynamicThead');
            const tbody = document.querySelector('#previewTable tbody');
            const tableEl = document.getElementById('table-container');
            const rowHeight = tableEl.offsetHeight / 11;

            const redPages = parseInt(document.getElementById('redPagesInput').value) || 0;
            const isRedMode = (index >= slidesData.length - redPages) && redPages > 0;
            const bgHeader = isRedMode ? '#FF0001' : '#4C8714';
            const bgOdd = isRedMode ? '#F9D7CD' : '#E2F0D9';
            const bgEven = '#ffffff';
            const borderColor = isRedMode ? '#FF7774' : '#8BB06B';
            const textColor = '#000000';
            const headerTextColor = '#ffffff';

            if (dynamicColumns.length > 0) {
                thead.innerHTML = '';
                let tr = document.createElement('tr');
                dynamicColumns.forEach(col => {
                    let th = document.createElement('th');
                    if (col.name.includes('[')) {
                        th.innerHTML = col.name.replace(/\n/g, '<br>').replace(/\[(\d+)\]([^\[]*)/g, function(match, size, content) {
                            return `<span style="font-size:${size}px;">${content}</span>`;
                        });
                    } else {
                        th.innerHTML = col.name.replace(/\n/g, '<br>');
                        th.style.fontSize = globalStyle.thFontSize + 'px';
                    }
                    th.style.width = col.width + '%';
                    th.style.height = rowHeight + 'px';
                    th.style.backgroundColor = bgHeader;
                    th.style.borderColor = borderColor;
                    th.style.color = headerTextColor;
                    tr.appendChild(th);
                });
                thead.appendChild(tr);
            }

            tbody.innerHTML = '';
            if (dynamicColumns.length > 0) {
                const emptyRows = 10 - slide.tableData.length;
                for(let i=0; i<emptyRows; i++) {
                    const tr = document.createElement('tr');
                    tr.style.height = rowHeight + 'px'; 
                    let bgColor = (i % 2 === 0) ? bgOdd : bgEven;
                    tr.innerHTML = dynamicColumns.map(() => `<td style="font-size:${globalStyle.tdFontSize}px; height:${rowHeight}px; background-color:${bgColor}; border-color:${borderColor}; color:${textColor}"></td>`).join('');
                    tbody.appendChild(tr);
                }
                slide.tableData.forEach((row, idx) => {
                    const tr = document.createElement('tr');
                    tr.style.height = rowHeight + 'px'; 
                    let absoluteRowIdx = emptyRows + idx;
                    let bgColor = (absoluteRowIdx % 2 === 0) ? bgOdd : bgEven;

                    let tdHtml = '';
                    const isProvRed = document.getElementById('provincialCapToggle').checked;
                    const provName = document.getElementById('provincialCapName').value.trim();

                    row.rowCells.forEach((c, cIdx) => {
                        let cellBgColor = bgColor;
                        let cellText = String(c);
                        let cellFontColor = textColor;
                        if (idx === 0 && /[^\d]1$/.test(cellText)) cellBgColor = '#FFFF00';
                        if (isProvRed && provName !== '' && cellText.includes(provName)) cellFontColor = '#FF0000';
                        tdHtml += `<td style="font-size:${globalStyle.tdFontSize}px; height:${rowHeight}px; background-color:${cellBgColor}; border-color:${borderColor}; color:${cellFontColor}">${c}</td>`;
                    });
                    tr.innerHTML = tdHtml;
                    tbody.appendChild(tr);
                });
            }

            document.getElementById('pageInput').value = index + 1;
            document.getElementById('totalPages').innerText = slidesData.length;
        }

        function prevSlide() { if (currentPreviewIndex > 0) { currentPreviewIndex--; renderSlide(currentPreviewIndex); } }
        function nextSlide() { if (currentPreviewIndex < slidesData.length - 1) { currentPreviewIndex++; renderSlide(currentPreviewIndex); } }
        document.getElementById('pageInput').addEventListener('change', function(e) {
            let targetPage = parseInt(e.target.value);
            if (isNaN(targetPage)) return;
            if (targetPage < 1) targetPage = 1;
            if (targetPage > slidesData.length) targetPage = slidesData.length;
            currentPreviewIndex = targetPage - 1;
            renderSlide(currentPreviewIndex);
        });

        document.getElementById('bgColor').addEventListener('input', (e) => { 
            globalStyle.bgColor = e.target.value; 
            document.getElementById('canvas').style.backgroundColor = globalStyle.bgColor; 
        });

        document.getElementById('tableWidthRange').addEventListener('input', (e) => {
            document.getElementById('table-container').style.width = e.target.value + 'px';
            renderSlide(currentPreviewIndex);
        });
        
        document.getElementById('tableHeightRange').addEventListener('input', (e) => {
            document.getElementById('table-container').style.height = e.target.value + 'px';
            renderSlide(currentPreviewIndex);
        });

        document.getElementById('emptyPagesInput').addEventListener('input', () => {
            if (window.currentCleanData) generateSlideData(window.currentCleanData);
        });

        document.getElementById('redPagesInput').addEventListener('input', () => { renderSlide(currentPreviewIndex); });
        document.getElementById('thFontSize').addEventListener('input', (e) => { globalStyle.thFontSize = parseInt(e.target.value); renderSlide(currentPreviewIndex); });
        document.getElementById('tdFontSize').addEventListener('input', (e) => { globalStyle.tdFontSize = parseInt(e.target.value); renderSlide(currentPreviewIndex); });

        // === 导出 PPT ===
        document.getElementById('exportBtn').addEventListener('click', async () => {
            if (slidesData.length === 0) return alert("请先上传地图图片！");

            const pptx = new PptxGenJS();
            pptx.defineLayout({ name: 'CUSTOM_16x9', width: 10, height: 5.625 });
            pptx.layout = 'CUSTOM_16x9';
            const PX_TO_INCH = 10 / 960; 
            const redPages = parseInt(document.getElementById('redPagesInput').value) || 0;
            const emptyPages = parseInt(document.getElementById('emptyPagesInput').value) || 0;
            const mapEl = document.getElementById('map-container');
            const tableEl = document.getElementById('table-container');
            const mapImgDom = document.getElementById('mapImg');

            document.getElementById('status').innerText = "正在生成PPT...";

            // ================= 生成第一页：独立封面 =================
            if (savedCoverData) {
                let coverSlide = pptx.addSlide();
                coverSlide.background = { color: rgbToHex(savedCoverData.bgColor || '#e2e2e2') };
                
                let coverBase64 = '';
                if (slidesData.length > 0) {
                    coverBase64 = await convertToBase64(slidesData[slidesData.length - 1].imageUrl);
                }

                if (coverBase64) {
                    let cImg = new Image();
                    cImg.src = coverBase64;
                    await new Promise(res => cImg.onload = res);
                    let realW = cImg.width;
                    let realH = cImg.height;

                    let boxW = savedCoverData.imgW || 960;
                    let boxH = savedCoverData.imgH || 540;
                    let imgRatio = realW / realH;
                    let boxRatio = boxW / boxH;
                    let renderW, renderH;
                    
                    if (imgRatio > boxRatio) {
                        renderW = boxW;
                        renderH = boxW / imgRatio;
                    } else {
                        renderH = boxH;
                        renderW = boxH * imgRatio;
                    }

                    let offsetX = (boxW - renderW) / 2;
                    let offsetY = (boxH - renderH) / 2;

                    coverSlide.addImage({ 
                        data: coverBase64, 
                        x: ((savedCoverData.imgX || 0) + offsetX) * PX_TO_INCH, 
                        y: ((savedCoverData.imgY || 0) + offsetY) * PX_TO_INCH, 
                        w: renderW * PX_TO_INCH, 
                        h: renderH * PX_TO_INCH, 
                        sizing: { type: 'crop', w: renderW * PX_TO_INCH, h: renderH * PX_TO_INCH }
                    });
                }

                savedCoverData.texts.forEach(t => {
                    let baseFontPt = Math.floor(t.fontSize * 0.75);
                    // 向下微调位置
                    let adjustedY = (t.y * PX_TO_INCH) + (baseFontPt * 0.001); 
                    let x = t.x * PX_TO_INCH;
                    let hexColor = rgbToHex(t.color);
                    
                    // 【关键参数】控制描边粗细：0.0015 大约是 1.2 磅的细边
                    // 如果觉得不够粗，可以改成 0.002 或 0.0025
                    let offset = baseFontPt * 0.0015; 
                    let dirs = [];
                    
                    // 使用 72 个方向（每 5 度一个点），密度极高，肉眼看起来绝对圆滑无锯齿
                    for(let i = 0; i < 72; i++) {
                        let angle = (i * Math.PI * 2) / 72;
                        dirs.push([Math.cos(angle) * offset, Math.sin(angle) * offset]);
                    }

                    // 1. 画 72 层纯白实心底层
                    dirs.forEach(dir => {
                        coverSlide.addText(t.content, { 
                            x: x + dir[0], 
                            y: adjustedY + dir[1], 
                            w: 10, h: 1.5, 
                            color: 'FFFFFF', 
                            fontSize: baseFontPt, 
                            bold: true, 
                            fontFace: 'Microsoft YaHei', 
                            wrap: false, autoFit: false, 
                            align: 'left', valign: 'top', margin: 0, lineSpacingMultiple: 1.0 
                        });
                    });

                    // 2. 顶层彩色字
                    coverSlide.addText(t.content, { 
                        x: x, y: adjustedY, 
                        w: 10, h: 1.5, 
                        color: hexColor, 
                        fontSize: baseFontPt, 
                        bold: true, fontFace: 'Microsoft YaHei', 
                        wrap: false, autoFit: false, 
                        align: 'left', valign: 'top', margin: 0, lineSpacingMultiple: 1.0 
                    });
                });
            }

            // ================= 生成数据页 =================
            for (let i = 0; i < slidesData.length; i++) {
                let slide = slidesData[i];
                let pptSlide = pptx.addSlide();
                pptSlide.background = { color: globalStyle.bgColor.replace('#', '') };

                // 1. 放入地图
                const base64Img = await convertToBase64(slide.imageUrl);
                let realW = mapImgDom.naturalWidth || 1;
                let realH = mapImgDom.naturalHeight || 1;
                let mapX = mapEl.offsetLeft * PX_TO_INCH;
                let mapY = mapEl.offsetTop * PX_TO_INCH;
                let mapW = mapEl.offsetWidth * PX_TO_INCH;
                let mapH = mapW * (realH / realW); 
                pptSlide.addImage({ data: base64Img, x: mapX, y: mapY, w: mapW, h: mapH, sizing: { type: 'crop', w: mapW, h: mapH } });

                // 2. 放入表格
                if (dynamicColumns.length > 0) {
                    let tX = tableEl.offsetLeft * PX_TO_INCH;
                    let tY = tableEl.offsetTop * PX_TO_INCH;
                    let tW = tableEl.offsetWidth * PX_TO_INCH;
                    let tH = tableEl.offsetHeight * PX_TO_INCH;
                    let rowH = (tH / 11) * 1.12; 
                    let colWidths = dynamicColumns.map(col => tW * (col.width / 100));
                    let colXOffsets = [0];
                    for(let c=0; c<colWidths.length-1; c++) colXOffsets.push(colXOffsets[c] + colWidths[c]);

                    const isRedMode = (i >= slidesData.length - redPages) && redPages > 0;
                    let headerColor = isRedMode ? 'FF0001' : '4C8714';
                    let oddColor = isRedMode ? 'F9D7CD' : 'E2F0D9';
                    let evenColor = 'FFFFFF';
                    let lineColor = isRedMode ? 'FF7774' : '8BB06B';
                    const emptyRowCount = 10 - slide.tableData.length;
                    let dataStartRow = 1 + emptyRowCount; 

                    for(let r=0; r<11; r++) {
                        for(let c=0; c<dynamicColumns.length; c++) {
                            let fillColor = evenColor;
                            if(r === 0) fillColor = headerColor;
                            else {
                                fillColor = (r % 2 !== 0) ? oddColor : evenColor;
                                if (r >= dataStartRow) {
                                    let dataIdx = r - dataStartRow;
                                    if (slide.tableData[dataIdx]) {
                                        let cellText = String(slide.tableData[dataIdx].rowCells[c]); 
                                        if (dataIdx === 0 && /[^\d]1$/.test(cellText)) fillColor = 'FFFF00'; 
                                    }
                                }
                            }
                            pptSlide.addShape(pptx.ShapeType.rect, { x: tX + colXOffsets[c], y: tY + (r * rowH), w: colWidths[c], h: rowH, fill: { color: fillColor }, line: { color: lineColor, width: 1 } });
                        }
                    }

                    dynamicColumns.forEach((col, c) => {
                        let textRuns = [];
                        let defaultPt = Math.floor(globalStyle.thFontSize * 0.75);
                        let plainText = col.name.replace(/\r\n/g, '\n').replace(/\r/g, '\n');
                        if (!plainText.includes('[')) {
                            textRuns.push({ text: plainText, options: { color: 'FFFFFF', fontSize: defaultPt, bold: true, fontFace: 'Microsoft YaHei' } });
                        } else {
                            const regex = /\[(\d+)\]([^\[]*)/g;
                            let match;
                            while ((match = regex.exec(plainText)) !== null) {
                                let fontPt = Math.floor(parseInt(match[1]) * 0.75);
                                textRuns.push({ text: match[2], options: { color: 'FFFFFF', fontSize: fontPt, bold: true, fontFace: 'Microsoft YaHei' } });
                            }
                        }
                        pptSlide.addText(textRuns, { x: tX + colXOffsets[c], y: tY, w: colWidths[c], h: rowH, align: 'center', valign: 'middle', margin: 0, lineSpacingMultiple: 1.2 });
                    });

                    const isProvRedExport = document.getElementById('provincialCapToggle').checked;
                    const provNameExport = document.getElementById('provincialCapName').value.trim();

                    slide.tableData.forEach((row, idx) => {
                        let r = dataStartRow + idx;
                        row.rowCells.forEach((cellText, c) => {
                            let cellFontColor = '000000';
                            if (isProvRedExport && provNameExport !== '' && String(cellText).includes(provNameExport)) cellFontColor = 'FF0000';
                            pptSlide.addText(cellText, { x: tX + colXOffsets[c], y: tY + (r * rowH), w: colWidths[c], h: rowH, fontSize: Math.floor(globalStyle.tdFontSize * 0.75), color: cellFontColor, bold: true, align: 'center', valign: 'middle', fontFace: 'Microsoft YaHei', margin: 0, valign: 'middle', lineSpacingMultiple: 1.2 });
                        });
                    });
                }
            }
            await pptx.writeFile({ fileName: "alphard.pptx" });
            document.getElementById('status').innerText = "✅ PPT 已生成并下载！";
        });

        function downloadSampleExcel() {
            const sampleData = [["排名", "地级", "县级", "人均GDP"],["1", "成都1", "武侯区", "228529"],["2", "宜宾1", "翠屏区", "180273"]];
            const ws = XLSX.utils.aoa_to_sheet(sampleData);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Sheet1");
            XLSX.writeFile(wb, "数据表格样例.xlsx");
        }

        function rgbToHex(c) {
            if (!c) return '000000';
            if (c.startsWith('#')) return c.replace('#','').toUpperCase();
            let m = c.match(/\d+/g);
            if (!m) return '000000';
            return m.slice(0,3).map(x => ('0' + parseInt(x).toString(16)).slice(-2)).join('').toUpperCase();
        }

        function convertToBase64(url) {
            return new Promise((resolve, reject) => {
                const img = new Image();
                img.crossOrigin = 'Anonymous';
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    canvas.width = img.width; canvas.height = img.height;
                    canvas.getContext('2d').drawImage(img, 0, 0);
                    resolve(canvas.toDataURL('image/png'));
                };
                img.onerror = reject; img.src = url;
            });
        }
    </script>
